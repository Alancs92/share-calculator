name: Security audit

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: ['**']
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  schedule:
    # Weekly, so newly-disclosed advisories in already-installed
    # dependencies surface even without a code change to trigger CI.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    # Skip while the PR is a draft; the scheduled run still catches new
    # advisories regardless (github.event.pull_request is unset there).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Fails the job on high/critical advisories. Moderate-and-below are
      # reported but don't block — see docs/development-guide.md for the
      # project's stance on dependency hygiene.
      - name: npm audit (high + critical)
        run: npm audit --audit-level=high
